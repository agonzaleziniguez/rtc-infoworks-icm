[project]
name = "rtc-infoworks-icm"
version = "0.1.0"
description = "Build InfoWorks ICM Real Time Control files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andres Gonzalez Iniguez", email = "a.gonzalez.iniguez@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []
keywords = ["infoworks", "icm", "rtc", "real-time-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/agonzaleziniguez/rtc-infoworks-icm"
Issues = "https://github.com/agonzaleziniguez/rtc-infoworks-icm/issues"
Documentation = "https://github.com/agonzaleziniguez/rtc-infoworks-icm#readme"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/rtc-infoworks-icm-mcp",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
testpaths = [
    "tests",
    "packages/rtc-infoworks-icm-mcp/tests",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.basedpyright]
include = [
    "src",
    "tests",
    "packages/rtc-infoworks-icm-mcp/src",
    "packages/rtc-infoworks-icm-mcp/tests",
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
